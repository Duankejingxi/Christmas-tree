<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#03050b" />
  <title>Merry Christmas · 圣诞树</title>
  <meta name="description" content="点亮一棵会发光的粒子圣诞树，挂上照片，邀请朋友一起来装饰。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
  </script>
</head>
<body class="booting">
  <canvas id="scene"></canvas>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="vignette"></div>

  <!-- 左上角：声音 -->
  <button id="soundBtn" class="corner-btn" aria-label="声音开关" hidden>
    <svg viewBox="0 0 24 24" class="ico-on"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>
    <svg viewBox="0 0 24 24" class="ico-off"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>

  <!-- 右上角：弹窗收起后变成的按钮 -->
  <button id="fab" class="fab" aria-label="打开">
    <span class="fab-glow"></span>
    <svg viewBox="0 0 24 24"><path d="M12 3.5 17 11h-3l4 6H6l4-6H7z"/><path d="M12 17v3.5"/></svg>
    <span id="fabText"></span>
  </button>

  <!-- 首页：做自己的树 -->
  <main id="landing" class="landing">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="script">Merry Christmas</h1>
    <p class="lead" id="lead">点亮一棵属于你的圣诞树</p>

    <div class="form" id="form">
      <label class="line-field" id="nickField">
        <input id="nick" type="text" maxlength="12" placeholder="你的名字" autocomplete="off" enterkeyhint="go" />
        <span class="line"></span>
      </label>
      <p class="field-tip" id="nickTip" hidden>已经帮你填好了，可以修改</p>

      <div class="themes" id="themes" role="radiogroup" aria-label="颜色">
        <button class="theme on" data-theme="ice" role="radio"><i></i><span>冰雪</span></button>
        <button class="theme" data-theme="gold" role="radio"><i></i><span>暖金</span></button>
        <button class="theme" data-theme="pink" role="radio"><i></i><span>樱粉</span></button>
      </div>

      <div class="slots" id="slots">
        <label class="slot add" id="addSlot" aria-label="添加照片">
          <input id="file" type="file" accept="image/*" multiple hidden />
          <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
        </label>
      </div>
      <p class="note" id="note">放几张照片进去 · 可选 · 最多 10 张</p>

      <button id="go" class="btn btn-primary btn-lg"><span id="goText">点亮我的圣诞树</span></button>
      <button id="alt" class="text-link"></button>
    </div>
  </main>

  <div id="caption" class="caption"></div>
  <div id="hint" class="hint"></div>
  <div id="swipeTip" class="swipe-tip">在字上划一下 ✦ 上下拖动树试试</div>

  <!-- 结束后的小工具栏 -->
  <nav id="dock" class="dock">
    <button data-act="replay"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.6h3.6"/></svg><span>再看一遍</span></button>
    <button data-act="album"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></svg><span>照片</span></button>
    <button data-act="save"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span>保存图片</span></button>
  </nav>

  <!-- 主弹窗（居中） -->
  <div id="cta" class="overlay modal-wrap">
    <div class="modal" id="ctaCard">
      <button class="modal-x" id="ctaClose" aria-label="收起"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="fan" id="ctaFan"></div>
      <p class="script small" id="ctaScript">Merry Christmas</p>
      <h2 class="modal-title" id="ctaTitle"></h2>
      <p class="modal-sub" id="ctaSub"></p>
      <div class="modal-actions">
        <button id="ctaPrimary" class="btn btn-primary btn-lg"></button>
        <button id="ctaSecondary" class="btn btn-secondary"></button>
      </div>
      <p class="modal-foot" id="ctaFoot"></p>
    </div>
  </div>

  <!-- 帮对方装饰（必须完成才能做自己的树） -->
  <div id="deco" class="overlay modal-wrap">
    <div class="modal" id="decoCard">
      <button class="modal-x" id="decoClose" aria-label="收起"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <p class="step"><b>1</b> 帮 TA 装饰 <i></i> <span>2</span> 做你自己的树</p>
      <h2 class="modal-title" id="decoTitle"></h2>
      <p class="modal-sub">挂上一张照片，就能制作你自己的圣诞树</p>
      <label class="slot add deco-slot" id="decoSlot">
        <input id="decoFile" type="file" accept="image/*" hidden />
        <img id="decoImg" alt="" hidden />
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
        <em>选一张照片</em>
      </label>
      <label class="line-field" id="decoNameField">
        <input id="decoName" type="text" maxlength="12" placeholder="你的昵称 · 会写在照片上" autocomplete="off" />
        <span class="line"></span>
      </label>
      <p class="field-tip">这个昵称也会用在你自己的圣诞树上</p>
      <label class="line-field">
        <input id="decoMsg" type="text" maxlength="30" placeholder="写一句祝福 · 可选" autocomplete="off" />
        <span class="line"></span>
      </label>
      <div class="modal-actions">
        <button id="decoGo" class="btn btn-primary btn-lg">挂上去，开始做我的树</button>
      </div>
    </div>
  </div>

  <!-- 保存图片预览 -->
  <div id="shotView" class="overlay shot">
    <button class="close" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <img id="shotImg" alt="圣诞树图片" />
    <p class="shot-tip" id="shotTip">长按图片，保存到相册</p>
    <button id="shotSave" class="btn btn-primary">保存图片</button>
  </div>

  <!-- 分享（链接 + 二维码） -->
  <div id="sheet" class="overlay">
    <div class="sheet">
      <button class="close" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <h2 class="script small">Share the joy</h2>
      <p class="sheet-title" id="sheetTitle">邀请朋友来装饰你的树</p>
      <p class="sheet-sub" id="sheetSub">每位朋友可以挂上一张照片，最多 10 位</p>
      <div class="qr" id="qr"></div>
      <div class="link-row">
        <input id="shareLink" readonly />
        <button id="copyBtn" class="btn btn-primary btn-sm">复制</button>
      </div>
      <div class="sheet-actions">
        <button id="nativeShare" class="text-link" hidden>系统分享 →</button>
      </div>
      <p class="demo-note" id="demoNote" hidden>演示模式：还没有配置云端存储，这个链接只在本机浏览器里有效。</p>
    </div>
  </div>

  <!-- 相册 -->
  <div id="album" class="overlay album">
    <div class="album-head">
      <div>
        <h2 class="script small">Memories</h2>
        <p id="albumTitle"></p>
      </div>
      <div class="album-actions">
        <button id="zipBtn" class="btn btn-secondary btn-sm">全部下载</button>
        <button class="close" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div class="album-grid" id="albumGrid"></div>
  </div>

  <!-- 大图 -->
  <div id="lightbox" class="overlay lightbox">
    <button class="close" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="nav prev" id="lbPrev" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="lbNext" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <figure>
      <img id="lbImg" alt="" />
      <figcaption>
        <span class="who" id="lbWho"></span>
        <span class="msg" id="lbMsg"></span>
        <span class="when" id="lbWhen"></span>
        <button id="lbDownload" class="text-link">下载 ↓</button>
      </figcaption>
    </figure>
  </div>

  <div id="loading" class="loading"><i></i><span id="loadingText"></span></div>
  <div id="toast" class="toast"></div>

  <noscript><p class="noscript">需要开启 JavaScript 才能看到圣诞树哦。</p></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
